<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="theme-color" content="#000000" />
    <link rel="canonical" href="https://skillstackershop.myshopify.com/" />
    
    <title>Skill Stacker Shop - Premium Web3 Merchandise & Apparel</title>
    <meta name="description" content="Shop exclusive Skill Stacker merchandise including hoodies, hats, and t-shirts. Premium Web3 community apparel powered by $STKR token on Solana. Join the Meme Militia movement.">
    <meta name="keywords" content="skill stacker, web3 merchandise, solana apparel, meme militia, $STKR token, crypto clothing, blockchain merchandise, community apparel" />
    <meta name="author" content="Skill Stacker" />

    <!-- Preconnect to Shopify domains for faster API and image loading -->
    <link rel="preconnect" href="https://skillstackershop.myshopify.com" crossorigin>
    <link rel="preconnect" href="https://cdn.shopify.com" crossorigin>
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://skillstackershop.myshopify.com/" />
    <meta property="og:site_name" content="Skill Stacker Shop" />
    <meta property="og:title" content="Skill Stacker Shop - Premium Web3 Merchandise & Apparel" />
    <meta property="og:description" content="Shop exclusive Skill Stacker merchandise including hoodies, hats, and t-shirts. Premium Web3 community apparel powered by $STKR token on Solana. Join the Meme Militia movement." />
    <meta property="og:image" content="https://storage.googleapis.com/gpt-engineer-file-uploads/EI6soCNnnShvmZQvknkd3QC1rPk2/social-images/social-1762580417600-skill-stacker-fb-group-cover-v3 copy.jpg">
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@SkillStacker" />
    <meta name="twitter:creator" content="@SkillStacker" />
    <meta name="twitter:title" content="Skill Stacker Shop - Premium Web3 Merchandise & Apparel" />
    <meta name="twitter:description" content="Shop exclusive Skill Stacker merchandise including hoodies, hats, and t-shirts. Premium Web3 community apparel powered by $STKR token on Solana. Join the Meme Militia movement." />
    <meta name="twitter:image" content="https://storage.googleapis.com/gpt-engineer-file-uploads/EI6soCNnnShvmZQvknkd3QC1rPk2/social-images/social-1762580417600-skill-stacker-fb-group-cover-v3 copy.jpg">
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="apple-touch-icon" href="/favicon.png">
    
    <!-- Structured Data for Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Skill Stacker",
      "url": "https://skillstackershop.myshopify.com/",
      "logo": "https://skillstackershop.myshopify.com/favicon.png",
      "description": "Web3 education and creator ecosystem built on Solana, powered by the $STKR token",
      "sameAs": [
        "https://twitter.com/SkillStacker",
        "https://discord.gg/skillstacker"
      ]
    }
    </script>
    
    <!-- Structured Data for Website -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Skill Stacker Shop",
      "url": "https://skillstackershop.myshopify.com/",
      "description": "Shop exclusive Skill Stacker merchandise and Web3 community apparel",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://skillstackershop.myshopify.com/shop?search={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
</head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
